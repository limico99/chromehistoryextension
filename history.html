<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>방문기록 날짜별 선택 삭제</title>
<style>
  :root {
    --bg: #f5f6f8;
    --panel: #ffffff;
    --border: #e2e4e8;
    --accent: #4285f4;
    --danger: #d93025;
    --text: #202124;
    --muted: #5f6368;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  header h1 { margin: 0; font-size: 17px; margin-right: auto; }
  .field-label { font-size: 12px; color: var(--muted); margin-right: 6px; }
  select, input[type="text"], input[type="date"] {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 8px;
    font-size: 13px;
  }
  .checkbox-field { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  #banner {
    display: none;
    background: #fef7e0;
    color: #7a5c00;
    padding: 10px 24px;
    font-size: 13px;
    border-bottom: 1px solid #f2d47a;
  }
  #infoBar {
    padding: 8px 24px;
    font-size: 12px;
    color: var(--muted);
    background: #fafbfc;
    border-bottom: 1px solid var(--border);
  }
  #layout {
    display: flex;
    height: calc(100vh - 108px);
  }
  #dates {
    width: 280px;
    background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }
  #dateToolbar {
    display: flex;
    gap: 6px;
    padding: 10px 8px 4px;
    border-bottom: 1px solid var(--border);
  }
  #dateToolbar button { font-size: 12px; padding: 6px 8px; }
  #dateSelectAllBtn { background: #eef1f5; color: var(--text); }
  #dateDeleteBtn { background: var(--danger); color: white; }
  #dateSelectedCount {
    padding: 4px 10px 0;
    font-size: 12px;
    color: var(--muted);
    min-height: 16px;
  }
  #dateList {
    overflow-y: auto;
    padding: 8px;
    flex: 1;
  }
  .date-item {
    padding: 8px 12px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    margin-bottom: 2px;
  }
  .date-item:hover { background: #f1f3f4; }
  .date-item.active { background: #e8f0fe; color: var(--accent); font-weight: 600; }
  .date-check { flex-shrink: 0; cursor: pointer; }
  .date-label { flex: 1; }
  .date-count { color: var(--muted); font-size: 12px; }

  #rangeBox {
    border-top: 1px solid var(--border);
    padding: 12px;
    background: #fafbfc;
  }
  #rangeBox h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
  #rangeBox .row { display: flex; gap: 6px; margin-bottom: 8px; align-items: center; }
  #rangeBox input[type="date"] { flex: 1; min-width: 0; }
  #rangeDeleteBtn { width: 100%; background: var(--danger); color: white; }

  #content {
    flex: 1;
    padding: 16px 24px;
    overflow-y: auto;
  }
  #searchBar { display: flex; gap: 8px; margin-bottom: 16px; }
  #searchBar input[type="text"] { flex: 1; }
  #toolbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 12px;
  }
  button {
    border: none;
    border-radius: 6px;
    padding: 8px 14px;
    font-size: 13px;
    cursor: pointer;
  }
  #deleteBtn { background: var(--danger); color: white; }
  #deleteBtn:disabled, #rangeDeleteBtn:disabled, #dateDeleteBtn:disabled { background: #e0a19c; cursor: not-allowed; }
  #selectAllBtn, #searchBtn, #clearSearchBtn, #reloadBtn { background: #eef1f5; color: var(--text); }
  table { width: 100%; border-collapse: collapse; background: var(--panel); border-radius: 8px; overflow: hidden; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); font-size: 13px; }
  th { background: #fafafa; color: var(--muted); font-weight: 600; }
  td.title { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  td.url { max-width: 300px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
  .empty { color: var(--muted); padding: 40px; text-align: center; }
  #status { margin-top: 12px; font-size: 13px; }
  #status.ok { color: #188038; }
  #status.err { color: var(--danger); }
  .spinner { font-size: 13px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <h1>방문기록 날짜별 선택 삭제</h1>
  <div>
    <span class="field-label">조회 범위</span>
    <select id="rangeSelect">
      <option value="7">최근 7일</option>
      <option value="30" selected>최근 30일</option>
      <option value="90">최근 90일</option>
      <option value="180">최근 180일</option>
      <option value="365">최근 1년</option>
    </select>
  </div>
  <button id="reloadBtn">새로고침</button>
  <button id="scheduleBtn">예약 관리</button>
  <div class="checkbox-field">
    <input type="checkbox" id="backupToggle" checked>
    <label for="backupToggle">삭제 전 백업 파일(JSON) 다운로드</label>
  </div>
</header>
<div id="banner"></div>
<div id="infoBar">불러오는 중...</div>
<div id="layout">
  <div id="dates">
    <div id="dateToolbar">
      <button id="dateSelectAllBtn">전체 선택/해제</button>
      <button id="dateDeleteBtn" disabled>선택 날짜 삭제</button>
    </div>
    <div id="dateSelectedCount"></div>
    <div id="dateList"><div class="empty">불러오는 중...</div></div>
    <div id="rangeBox">
      <h3>날짜 범위 일괄 삭제</h3>
      <div class="row">
        <input type="date" id="rangeStart">
        <span>~</span>
        <input type="date" id="rangeEnd">
      </div>
      <button id="rangeDeleteBtn">해당 기간 전체 삭제</button>
    </div>
  </div>
  <div id="content">
    <div id="searchBar">
      <input type="text" id="searchInput" placeholder="URL 또는 제목 키워드로 검색 (전체 기록 대상)...">
      <button id="searchBtn">검색</button>
      <button id="clearSearchBtn">검색 초기화</button>
    </div>
    <div id="toolbar" style="display:none;">
      <button id="selectAllBtn">전체 선택/해제</button>
      <button id="deleteBtn">선택 항목 삭제</button>
      <span id="selectedCount" style="color:var(--muted); font-size:13px;"></span>
    </div>
    <div id="tableWrap"><div class="empty">왼쪽에서 날짜를 선택하거나, 위에서 검색해보세요.</div></div>
    <div id="status"></div>
  </div>
</div>
<script src="history.js"></script>
</body>
</html>
